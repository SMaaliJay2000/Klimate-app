name: Build Frontend (React)

on:
  push:
    branches: [main]
    paths:
      - "Klimate-app/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "Klimate-app/**"

env:
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Klimate-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Klimate-app

      - name: Build
        run: npm run build
        working-directory: Klimate-app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Klimate-app/build
          retention-days: 7
